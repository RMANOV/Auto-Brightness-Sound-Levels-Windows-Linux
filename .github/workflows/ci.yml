name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} and shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check manager syntax
        run: bash -n adaptive_controller_manager.sh
      - name: Run isolated regression tests
        run: timeout --kill-after=5s 90s python -m unittest discover -s tests -v

  rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: adaptive-rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: '1.87.0'
      - name: Run unit and documentation tests without hardware
        run: cargo test --workspace --locked
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Register and inspect the 10-minute task without running the controller
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "AdaptiveController-CI-Every10Min-$env:GITHUB_RUN_ID"
          $refused = $false
          try { & .\scripts\setup-10min-task.ps1 -ControllerExe 'C:\missing\adaptive-controller.exe' -TaskName $name } catch { $refused = $true }
          if (-not $refused -or (Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue)) { throw 'A missing controller must not register a task' }
          # A relative controller path must be stored absolute: the task starts in System32.
          $exe = Join-Path (Get-Location).Path 'ci-controller.exe'
          Copy-Item -LiteralPath "$env:SystemRoot\System32\whoami.exe" -Destination $exe
          & .\scripts\setup-10min-task.ps1 -ControllerExe '.\ci-controller.exe' -TaskName $name
          try {
            $task = Get-ScheduledTask -TaskName $name
            $repeat = $task.Triggers[0].Repetition
            if ($repeat.Interval -ne 'PT10M' -or $repeat.Duration -ne 'P1D') { throw "Unexpected repetition: $($repeat.Interval) / $($repeat.Duration)" }
            $action = $task.Actions[0]
            if ($action.Execute -notlike '*\System32\conhost.exe' -or $action.Arguments -ne "--headless `"$exe`" --max-runtime-secs 480") { throw "Unexpected action: $($action.Execute) $($action.Arguments)" }
            if ("$($task.Settings.MultipleInstances)" -ne 'IgnoreNew' -or $task.Settings.ExecutionTimeLimit -ne 'PT9M') { throw "Unexpected settings: $($task.Settings.MultipleInstances) $($task.Settings.ExecutionTimeLimit)" }
          } finally {
            Unregister-ScheduledTask -TaskName $name -Confirm:$false
          }
          # The hidden launcher must run the program, pass the run-limit flag through, and return.
          $marker = Join-Path $env:RUNNER_TEMP 'headless-ran.txt'
          $launcher = Start-Process -FilePath "$env:SystemRoot\System32\conhost.exe" -ArgumentList '--headless', 'cmd.exe', '/c', "echo --max-runtime-secs 480 > `"$marker`"" -PassThru
          if (-not $launcher.WaitForExit(30000)) { $launcher.Kill(); throw 'conhost --headless did not return' }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'conhost --headless did not run the program' }
          if ((Get-Content -LiteralPath $marker -Raw) -notlike '*--max-runtime-secs 480*') { throw "conhost did not pass arguments: $(Get-Content -LiteralPath $marker -Raw)" }
